name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (Backend)
        run: cd backend && npm install

      - name: Lancer les tests (Backend)
        run: cd backend && npm test

      - name: Installer les dépendances (Frontend)
        run: cd frontend && npm install

      - name: Lancer les tests (Frontend)
        run: cd frontend && npm test

      - name: Simuler le déploiement
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Déploiement en cours..."
